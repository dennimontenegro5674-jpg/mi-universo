<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Scarlet ❤️</title>

    <link rel="stylesheet" href="login.css">

    <!-- 🌌 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

    <!-- 🌌 FONDO DE ESTRELLAS -->
    <div id="galaxia"></div>


    <!-- ❤️ LOGIN -->
    <div class="login-box" id="loginBox">

        <h2>Mi universo ❤️</h2>

        <p>Un lugar creado especialmente para ti ✨</p>

        <input
            type="text"
            id="nombre"
            placeholder="Tu nombre"
            autocomplete="off"
        >

        <input
            type="password"
            id="contraseña"
            placeholder="Tu contraseña"
        >

        <button
            class="login-btn"
            onclick="iniciarSesion()"
        >
            Entrar ✨
        </button>

    </div>


    <!-- ❤️ UNIVERSO FINAL -->
    <div class="universo" id="universo">

        <!-- ❤️ CORAZÓN 3D + ESTRELLAS -->
        <div class="galaxia-centro"></div>


        <!-- ✨ DECORACIÓN -->
        <div class="estrellas">
            ✦ ✧ ✦
        </div>


        <!-- ❤️ TÍTULO -->
        <h1>
            Mi lugar favorito eres tú ❤️
        </h1>


        <!-- 💗 MENSAJE -->
        <p id="mensaje">
            Scarlet, este pequeño universo es solo para ti ❤️
        </p>


        <!-- 💕 FRASE -->
        <div class="corazones">
            Te amo mucho, mi niña ❤️
        </div>

    </div>


    <!-- 🌌 SCRIPT PRINCIPAL -->
    <script src="script.js"></script>


    <!-- ✨ EFECTO 3D DEL LOGIN -->
    <script>

        const caja = document.getElementById("loginBox");

        function moverLogin(x, y) {

            if (!caja) return;

            const rect = caja.getBoundingClientRect();

            const centroX =
                rect.left + rect.width / 2;

            const centroY =
                rect.top + rect.height / 2;

            const rotacionY =
                (x - centroX) / 35;

            const rotacionX =
                (centroY - y) / 35;

            caja.style.transform =
                `perspective(800px)
                 rotateY(${rotacionY}deg)
                 rotateX(${rotacionX}deg)`;
        }


        /* 🖱️ MOUSE */
        document.addEventListener("mousemove", (e) => {

            if (
                caja &&
                caja.style.display !== "none" &&
                !caja.classList.contains("salir")
            ) {

                moverLogin(
                    e.clientX,
                    e.clientY
                );
            }

        });


        /* 📱 CELULAR */
        document.addEventListener(
            "touchmove",
            (e) => {

                if (
                    !caja ||
                    caja.style.display === "none" ||
                    caja.classList.contains("salir")
                ) return;

                const dedo = e.touches[0];

                moverLogin(
                    dedo.clientX,
                    dedo.clientY
                );

            },
            { passive: true }
        );


        /* ❤️ VOLVER AL CENTRO */
        document.addEventListener("mouseleave", () => {

            if (caja) {

                caja.style.transform =
                    "perspective(800px) rotateY(0deg) rotateX(0deg)";
            }

        });

    </script>

</body>

</html>
