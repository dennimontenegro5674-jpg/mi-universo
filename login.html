<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mi Universo 💗</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-box" id="loginBox">
        <h2>Mi Universo 💗</h2>
        <p>Bienvenido</p>

        <input type="text" placeholder="Tu nombre">
        <input type="password" placeholder="Tu contraseña">

        <button class="login-btn" onclick="iniciarSesion()">
            Entrar ✨
        </button>
    </div>

    <script src="script.js"></script>

    <script>
        const caja = document.getElementById("loginBox");

        function moverLogin(x, y) {
            const rotacionX = (window.innerWidth / 2 - x) / 25;
            const rotacionY = (window.innerHeight / 2 - y) / 25;

            caja.style.transform =
                `perspective(800px) rotateY(${rotacionX}deg) rotateX(${rotacionY}deg)`;
        }

        // Movimiento con mouse
        document.addEventListener("mousemove", (e) => {
            moverLogin(e.clientX, e.clientY);
        });

        // Movimiento con dedo
        document.addEventListener("touchmove", (e) => {
            const dedo = e.touches[0];
            moverLogin(dedo.clientX, dedo.clientY);
        }, { passive: true });

        // Volver al centro
        document.addEventListener("mouseleave", () => {
            caja.style.transform =
                "perspective(800px) rotateY(0deg) rotateX(0deg)";
        });

        document.addEventListener("touchend", () => {
            caja.style.transform =
                "perspective(800px) rotateY(0deg) rotateX(0deg)";
        });
    </script>

</body>
</html>
